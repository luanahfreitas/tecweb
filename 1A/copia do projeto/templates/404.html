<!doctype html>
<!--
  ===========================================================================
  templates/404.html — PÁGINA NÃO ENCONTRADA (conceito A)
  Devolvida pela função not_found com build_response(code=404, ...)
  NÃO passa pelo .format() (não tem buracos).
  README_1A.md → Parte 5 — Página 404
  ===========================================================================
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get-it - Página não encontrada</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
      integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <!-- COM BARRA: a 404 pode aparecer em QUALQUER rota (/a/b/c), só caminho absoluto funciona sempre -->
    <link rel="stylesheet" href="/getit.css" />
  </head>

  <body>
    <div class="appbar">
      <img src="/img/logo-getit.png" class="logo" />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
    </div>

    <main class="container">
      <div class="not-found">
        <span class="not-found-icon">🔍</span>
        <!-- Mensagem amigável (pedido do enunciado) -->
        <h1 class="not-found-title">Ops, essa página não existe</h1>
        <p class="not-found-text">
          A anotação ou o link que você tentou acessar não foi encontrado.
        </p>
        <!-- Link para voltar para a home (pedido do enunciado) -->
        <a class="btn" href="/">Voltar para a página principal</a>
      </div>
    </main>
  </body>
</html>
