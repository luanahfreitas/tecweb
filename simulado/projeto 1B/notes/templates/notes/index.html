{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<form class="form-card" method="post">
  {% csrf_token %}
  <input class="form-card-title" type="text" id="titulo" name="titulo" placeholder="Título" />
  <textarea class="autoresize" id="detalhes" name="detalhes" placeholder="Detalhes"></textarea>
  <input type="text" name="tags" placeholder="Tags (separadas por vírgula, ex: tag1, tag2)" style="border:none; outline:none; font-family:'Roboto',sans-serif; font-size:14px; color:#4c4c4c; margin-bottom:16px; padding:0;"/>
  <button class="btn" type="submit">Salvar</button>
</form>

<div class="card-container">
  {% for note in notes %}
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">{{ note.title }}</h3>
      <div class="card-actions">
        <a class="card-edit" href="{% url 'edit' note.id %}">
        <img src="{% static 'notes/img/edit.png' %}" alt="Editar" />
        </a>
        <a class="card-delete" href="{% url 'delete' note.id %}">
        <img src="{% static 'notes/img/lixeira.png' %}" alt="Excluir" />
        </a>
    </div>
    </div>
    <div class="card-content">
    <p>{{ note.content }}</p>
    </div>
    <div class="tag-badges">
        {% for tag in note.tags.all %}
        <a href="{% url 'tag_detail' tag.id %}" class="tag-badge">#{{ tag.name }}</a>
        {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
