{% extends "notes/base.html" %}

{% block content %}
<table style="width:100%; max-width:700px; margin:0 auto; border-collapse:collapse; font-family:'Roboto',sans-serif; background:#ffffff; box-shadow:0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23); border-radius:4px; overflow:hidden;">
  <thead>
    <tr style="background:#f4f4f4;">
      <th style="text-align:left; padding:14px 20px; font-size:13px; letter-spacing:0.05em; color:#4c4c4c; text-transform:uppercase;">Tag</th>
      <th style="text-align:center; padding:14px 20px; font-size:13px; letter-spacing:0.05em; color:#4c4c4c; text-transform:uppercase;">Anotações</th>
    </tr>
  </thead>
  <tbody>
    {% for tag in tags %}
    <tr style="border-top:1px solid #eee;">
      <td style="padding:14px 20px; color:#2c2c2c; font-size:15px;">#{{ tag.name }}</td>
      <td style="text-align:center; padding:14px 20px;">
        <a href="{% url 'tag_detail' tag.id %}" style="text-decoration:none; color:#4c4c4c; font-size:16px;">🔗</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
