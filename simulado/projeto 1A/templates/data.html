<!doctype html>
<!--
  [SIMULADO 1.1] ✅ HTML novo e válido (html, head, body)
  Sem chaves nos comentários: este arquivo passa pelo .format()
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get-it - Pagina Horario</title>
  </head>

  <body>
    <!-- ✅ h1 fica no BODY ("cabeçalho h1" = tag de título, não o head).
         ⚠ O enunciado escreve "Avaliação Intermediária" (com acento no á). Corrigi. -->
    <h1>Avaliação Intermediária</h1>
    <!-- ✅ buraco preenchido pela view data() com .format(data=...) -->
    <h2>{data}</h2>
  </body>
</html>
